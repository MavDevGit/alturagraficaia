<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050814" />
    <meta
      name="description"
      content="Amplía, recorta y expande imágenes con IA desde un único taller visual."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (() => {
        try {
          const mode = localStorage.getItem("altura.theme") === "dark" ? "dark" : "light";
          document.documentElement.classList.add(mode);
          document.documentElement.dataset.theme = mode;
          document.documentElement.style.colorScheme = mode;
        } catch {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
    <!--
      THESIS: Un taller de luz digital donde la imagen, no el chrome, gobierna la atención.
      OWN-WORLD: Carbón, papel cálido y verde esmeralda forman una superficie técnica serena.
      STORY: Cargar → configurar → procesar → inspeccionar detalle real → descargar.
      FIRST VIEWPORT: Navegación compacta, lienzo dominante, inspector de 320 px y estado visible.
      FORM: Controles precisos, esquinas sobrias, jerarquía por contraste y ritmo de 8 px.
    -->
    <title>Altura Gráfica IA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
