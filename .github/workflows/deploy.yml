name: Deploy production

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Alcance del despliegue"
        required: true
        type: choice
        default: cloud-run
        options:
          - cloud-run
          - all

concurrency:
  group: altura-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'MavDevGit/alturagraficaia'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      APP_ENV: testing
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: us-central1
      MEDIA_BUCKET: ${{ vars.MEDIA_BUCKET }}
      VM_NAME: ${{ vars.VM_NAME }}
      VM_ZONE: ${{ vars.VM_ZONE }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_pgsql
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Install and verify
        run: |
          npm ci
          composer --working-dir=apps/api install --no-interaction
          npm run contracts
          npm run lint
          npm run test
        working-directory: .
        env:
          DB_CONNECTION: sqlite

      - name: Build production PWA
        run: npm run build -w apps/web
        env:
          VITE_API_URL: ${{ vars.APP_URL }}/api/v1
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          VITE_USE_AUTH_EMULATOR: "false"
          VITE_AUTH_DRIVER: firebase

      - name: Prepare Laravel runtime
        run: composer install --no-dev --classmap-authoritative --no-interaction
        working-directory: apps/api

      - name: Build and push image worker
        shell: bash
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/altura/image-service:$GITHUB_SHA"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build --tag "$IMAGE" apps/image-service
          docker push "$IMAGE"

      - name: Deploy Cloud Run services
        shell: pwsh
        run: ./infra/gcp/deploy-image-service.ps1 -ProjectId $env:GCP_PROJECT_ID -BucketName $env:MEDIA_BUCKET -CallbackUrl "$env:APP_URL/api/internal/image-callback" -ImageTag $env:GITHUB_SHA

      - name: Package VM release
        if: inputs.target == 'all'
        shell: bash
        run: |
          PACKAGE="/tmp/altura-$GITHUB_SHA.tar.gz"
          tar --exclude='apps/api/.env' --exclude='apps/api/storage' --exclude='apps/web/node_modules' \
            -czf "$PACKAGE" apps/api apps/web/dist
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
          echo "PACKAGE_SHA=$(sha256sum "$PACKAGE" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Deploy immutable VM release through IAP
        if: inputs.target == 'all'
        shell: bash
        run: |
          REMOTE_PACKAGE="/tmp/altura-$GITHUB_SHA.tar.gz"
          gcloud compute scp "$PACKAGE" "$VM_NAME:$REMOTE_PACKAGE" \
            --zone="$VM_ZONE" --project="$GCP_PROJECT_ID" --tunnel-through-iap --quiet
          gcloud compute ssh "$VM_NAME" --zone="$VM_ZONE" --project="$GCP_PROJECT_ID" \
            --tunnel-through-iap --quiet \
            --command="sudo /usr/local/sbin/altura-deploy '$REMOTE_PACKAGE' '$GITHUB_SHA' '$PACKAGE_SHA'"
