name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
    services:
      postgres:
        image: postgres:16
        env:
          {
            POSTGRES_USER: alturagrafica,
            POSTGRES_PASSWORD: test,
            POSTGRES_DB: alturagrafica_pwa_test,
          }
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22, cache: npm }
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with: { php-version: "8.4", extensions: mbstring, intl, pdo_pgsql }
      - run: npm ci
      - run: composer install --no-interaction
        working-directory: apps/api
      - run: npm run contracts && npm run lint && npm run test && npm run build
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: alturagrafica_pwa_test
          DB_USERNAME: alturagrafica
          DB_PASSWORD: test
