name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
    services:
      postgres:
        image: postgres:16
        env:
          {
            POSTGRES_USER: alturagrafica,
            POSTGRES_PASSWORD: test,
            POSTGRES_DB: alturagrafica_pwa_test,
          }
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with: { php-version: "8.4", extensions: mbstring, intl, pdo_pgsql }
      - run: npm ci
      - run: composer install --no-interaction
        working-directory: apps/api
      - run: npm run contracts && npm run lint && npm run test && npm run build
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: alturagrafica_pwa_test
          DB_USERNAME: alturagrafica
          DB_PASSWORD: test
